server {
    listen 80;
    server_name _;

    # Chat unificado (SPA) — index.html para rotas do React (se houver)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy do WebSocket do chat para o back-end
    location /ws {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Overlay OBS (HTML + token) e seu WS
    location /overlay {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API e health
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend:4000;
    }
}
